<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유이 콘텐츠 팀</title>
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#1f2328; --muted:#6a6f76; --line:#e3e1dc;
  --accent:#3b6fd8; --accent-soft:#e8effc;
  --hcp:#2f8f6b; --hcp-soft:#e4f3ec; --pub:#c0632b; --pub-soft:#fbeadf;
  --ok:#2f8f6b; --watch:#b8860b; --fix:#c0632b; --stop:#c23b3b; --unk:#8a8f96;
  --ok-soft:#e4f3ec; --watch-soft:#fbf3dc; --fix-soft:#fbeadf; --stop-soft:#fbe4e4; --unk-soft:#eeeeee;
  --floor:#efece6; --desk:#fffdf8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --panel:#1f2226; --ink:#e8e9ea; --muted:#9aa0a7; --line:#33373c;
    --accent:#7aa2f7; --accent-soft:#25304a;
    --hcp:#5cc49b; --hcp-soft:#1e3a30; --pub:#f0965a; --pub-soft:#3d2a1e;
    --ok:#5cc49b; --watch:#e0b84a; --fix:#f0965a; --stop:#f07a7a; --unk:#9aa0a7;
    --ok-soft:#1e3a30; --watch-soft:#3a3320; --fix-soft:#3d2a1e; --stop-soft:#3f2224; --unk-soft:#2a2d31;
    --floor:#1b1d20; --desk:#24272b;
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --panel:#1f2226; --ink:#e8e9ea; --muted:#9aa0a7; --line:#33373c;
  --accent:#7aa2f7; --accent-soft:#25304a;
  --hcp:#5cc49b; --hcp-soft:#1e3a30; --pub:#f0965a; --pub-soft:#3d2a1e;
  --ok:#5cc49b; --watch:#e0b84a; --fix:#f0965a; --stop:#f07a7a; --unk:#9aa0a7;
  --ok-soft:#1e3a30; --watch-soft:#3a3320; --fix-soft:#3d2a1e; --stop-soft:#3f2224; --unk-soft:#2a2d31;
  --floor:#1b1d20; --desk:#24272b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px}
.wrap{max-width:1200px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0}
.sub{color:var(--muted);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:6px 12px;font:inherit;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
nav.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
nav.tabs button{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:8px 8px 0 0;font:inherit;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--ink);background:var(--bg);font-weight:600}
nav.tabs button[disabled]{opacity:.45;cursor:default}
main{padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:8px;font:inherit;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.muted{color:var(--muted)}
.small{font-size:12px}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.v-유지{background:var(--ok-soft);color:var(--ok)}
.v-지켜보기{background:var(--watch-soft);color:var(--watch)}
.v-수정{background:var(--fix-soft);color:var(--fix)}
.v-중단후보{background:var(--stop-soft);color:var(--stop)}
.v-아직모름,.v-목표없음{background:var(--unk-soft);color:var(--unk)}
.aud-HCP{background:var(--hcp-soft);color:var(--hcp)}
.aud-대중{background:var(--pub-soft);color:var(--pub)}
.aud-공통{background:var(--accent-soft);color:var(--accent)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;white-space:nowrap}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px}
.tile b{display:block;font-size:22px}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.cell{display:flex;flex-direction:column;align-items:center;gap:2px}
.err{background:var(--stop-soft);color:var(--stop);border-radius:8px;padding:8px 10px;margin-top:8px}
textarea{width:100%;min-height:150px;font:12px/1.4 ui-monospace,Consolas,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
input[type=number],input[type=text]{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:inherit}
input[type=number]{width:72px}
details>summary{cursor:pointer;font-weight:600}
.prop{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.prop.done{opacity:.6}
.prop .row input[type=text]{flex:1;min-width:160px}
/* office */
.office{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;background:var(--floor);padding:12px;border-radius:14px}
.room{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:10px;min-height:120px}
.room h3{margin:0 0 8px;font-size:13px;color:var(--muted)}
.room.span2{grid-column:span 2}
.desk{background:var(--desk);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;transition:opacity .3s}
.desk.dim{opacity:.3}
.desk .who{display:flex;align-items:center;gap:6px;font-weight:600}
.avatar{font-size:22px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--unk)}
.st-작업중 .dot{background:var(--ok);animation:pulse 1s infinite}
.st-승인대기 .dot{background:var(--watch)}
.st-막힘 .dot{background:var(--stop)}
@keyframes pulse{50%{opacity:.3}}
.task{font-size:12px;margin-top:4px}
.bubble{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:12px;margin-top:6px}
.bubble li{margin-left:-14px}
.log{max-height:260px;overflow:auto;font-size:12px}
.log div{padding:4px 0;border-bottom:1px solid var(--line)}
.inbox b{font-size:28px}
@media (max-width:820px){.office{grid-template-columns:1fr 1fr}.room.span2{grid-column:span 2}}
@media (max-width:520px){.office{grid-template-columns:1fr}.room.span2{grid-column:span 1}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <div><h1>유이 콘텐츠 팀 · 종합 대시보드</h1>
      <div class="sub">프로토타입 · 모든 숫자는 샘플(가짜) 데이터예요 · 원칙 출처: 스폰지클럽 워크플로우 스타트킷 · 에밀리의 ROY 키트(BYEM)</div></div>
    <div class="seg" id="audSeg">
      <button data-aud="all" class="on">전체</button><button data-aud="HCP">약사 · HCP</button><button data-aud="대중">대중</button>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="office" class="on">🏢 사무실</button>
    <button data-tab="perf">📊 성과 진단</button>
    <button disabled title="다음 단계">기획</button><button disabled title="다음 단계">제작 스튜디오</button>
    <button disabled title="다음 단계">리뷰</button><button disabled title="다음 단계">러닝</button>
  </nav>
</div></header>

<main><div class="wrap">
  <section id="office"></section>
  <section id="perf" hidden></section>
</div></main>

<script>
// ── 채널 정의: 모든 채널을 같은 줄(분모 → 반응 → 행동 → 전환)로 맞춘다 ──
const CH = {
  kakao:    {label:'카카오톡', aud:'HCP', base:'발송', reaction:'열람', action:'클릭', conv:'자료 받기', min:200},
  lms:      {label:'문자(LMS)', aud:'HCP', base:'발송', reaction:null, action:'링크 클릭', conv:'문의', min:200},
  email:    {label:'HCP 이메일', aud:'HCP', base:'발송', reaction:'오픈', action:'클릭', conv:'자료 요청', min:200},
  linkedin: {label:'링크드인', aud:'HCP', base:'노출', reaction:'참여', action:'클릭', conv:null, min:1000},
  instagram:{label:'인스타(오가닉)', aud:'대중', base:'도달', reaction:'참여', action:'링크 클릭', conv:null, min:1000},
  meta_ads: {label:'Meta 광고', aud:'대중', base:'노출', reaction:'링크 클릭(CTR)', action:'랜딩 도착', conv:'구매', min:5000, ads:true, actionDenom:'reaction'}
};
const DEFAULT_GOALS = { // 예시 목표 — 관리자가 정한다 (r-6)
  kakao:{r:40,a:8}, lms:{a:3}, email:{r:25,a:4}, linkedin:{r:2,a:0.6},
  instagram:{r:4,a:0.8}, meta_ads:{r:1.2,a:70,c:2,cpa:60000}
};
const RULES = [
  ['r-1','한 번으로 판단하지 않아요','한 기간만 목표에 못 미치면 「지켜보기」. 같은 일이 2회 이어지면 그때 말해요. 분모가 적으면 「아직 모름」.'],
  ['r-2','같은 채널 · 같은 청중끼리만 비교해요','카카오 열람률과 인스타 참여율을 나란히 놓고 이기고 지는 걸 말하지 않아요.'],
  ['r-3','반응은 되는데 행동이 없으면 문구 · 버튼 · 랜딩부터','주제를 버리기 전에 첫 장 · 버튼 문구 · 도착 페이지를 먼저 고쳐요.'],
  ['r-4','반응이 낮으면 미리보기 · 첫 문장 · 시간부터','열람 · 참여가 낮으면 제목 · 미리보기 문구 · 보낸 시간을 먼저 봐요.'],
  ['r-5','2회 연속 반응도 행동도 못 미치면 중단 후보','끌지는 관리자가 정해요. AI는 후보로만 올려요.'],
  ['r-6','목표는 관리자가 정해요','목표가 없으면 높다 · 낮다를 말하지 않아요.'],
  ['r-7','(광고) 빈도 3 이상 + 클릭률 20% 넘게 하락 = 소재 피로','같은 소재를 계속 본 사람이 많아요. 새 소재를 만들어요.'],
  ['r-8','(광고) 지출이 늘었다 ≠ 예산을 올렸다','변경 기록을 보기 전에는 예산 변경이라고 말하지 않아요.'],
  ['r-9','두 채널 이상에서 같이 부진하면 메시지 문제','채널 각색이 아니라 콘텐츠 메시지 자체를 기획자가 다시 봐요.']
];
const SAMPLE = `period,content,title,channel,base,reaction,action,conversion,spend,frequency
2026-10-20,C-001,바르는 순서편,kakao,1200,540,120,30,,
2026-10-27,C-001,바르는 순서편,kakao,1300,598,135,34,,
2026-10-20,C-001,바르는 순서편,lms,900,,36,6,,
2026-10-27,C-001,바르는 순서편,lms,950,,38,7,,
2026-10-20,C-001,바르는 순서편,email,400,124,20,3,,
2026-10-27,C-001,바르는 순서편,email,420,126,19,4,,
2026-10-20,C-001,바르는 순서편,linkedin,2000,30,6,,,
2026-10-27,C-001,바르는 순서편,linkedin,2100,29,5,,,
2026-10-20,C-001,바르는 순서편,instagram,8000,400,30,,,
2026-10-27,C-001,바르는 순서편,instagram,8600,447,31,,,
2026-10-20,C-001,바르는 순서편,meta_ads,40000,600,470,11,480000,1.8
2026-10-27,C-001,바르는 순서편,meta_ads,52000,540,410,6,650000,3.4
2026-10-20,C-002,시작 시점편,kakao,1100,330,44,5,,
2026-10-27,C-002,시작 시점편,kakao,1150,334,46,6,,
2026-10-20,C-002,시작 시점편,lms,900,,13,1,,
2026-10-27,C-002,시작 시점편,lms,920,,14,1,,
2026-10-27,C-002,시작 시점편,email,150,40,5,0,,
2026-10-20,C-002,시작 시점편,instagram,3000,60,10,,,
2026-10-27,C-002,시작 시점편,instagram,3200,64,11,,,
2026-10-27,C-003,관리 기간편,kakao,1250,600,112,25,,
2026-10-27,C-003,관리 기간편,linkedin,1500,45,12,,,
2026-10-27,C-003,관리 기간편,instagram,7000,210,63,,,
2026-10-27,C-004,자외선편,instagram,9000,500,90,,,
2026-10-27,C-004,자외선편,meta_ads,30000,420,85,1,300000,1.5`;

const store = {
  get(k,d){ try{ const v=localStorage.getItem('yui-dash:'+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('yui-dash:'+k,JSON.stringify(v)); }catch(e){} }
};
const S = {
  aud:'all', tab:'office', csv:SAMPLE, errors:[], results:[], proposals:[],
  goals: store.get('goals', JSON.parse(JSON.stringify(DEFAULT_GOALS))),
  decisions: store.get('decisions', {}),
  log:[], clock:9*60, step:0, timer:null
};
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = v => v==null||!isFinite(v) ? '–' : (v*100).toFixed(v<0.01?2:1)+'%';
const won = v => v==null||!isFinite(v) ? '–' : Math.round(v).toLocaleString('ko-KR')+'원';
const vClass = v => 'v-'+v.replace(/\s/g,'');
const audOk = a => S.aud==='all' || S.aud===a;

// ── 계산기: 숫자는 AI가 아니라 코드가 낸다 (토큰 0) ──
function parseCSV(text){
  const errors=[], rows=[];
  const lines=text.trim().split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2){ errors.push('데이터가 비어 있어요. 머리줄과 한 줄 이상이 필요해요.'); return {rows,errors}; }
  const head=lines[0].split(',').map(h=>h.trim());
  const need=['period','content','title','channel','base','reaction','action'];
  const miss=need.filter(n=>!head.includes(n));
  if(miss.length){ errors.push('필요한 열이 없어요: '+miss.join(', ')+' — 샘플 CSV의 머리줄을 확인하세요.'); return {rows,errors}; }
  const num=v=>{ v=(v??'').trim(); if(v==='') return null; const n=Number(v.replace(/,/g,'')); return isFinite(n)?n:NaN; };
  lines.slice(1).forEach((l,i)=>{
    const c=l.split(','), o={}; head.forEach((h,j)=>o[h]=(c[j]??'').trim());
    if(!CH[o.channel]){ errors.push(`${i+2}번째 줄: 모르는 채널 「${o.channel}」 — kakao · lms · email · linkedin · instagram · meta_ads 중 하나`); return; }
    const r={period:o.period,content:o.content,title:o.title,channel:o.channel,
      base:num(o.base),reaction:num(o.reaction),action:num(o.action),conversion:num(o.conversion),spend:num(o.spend),frequency:num(o.frequency)};
    if(!(r.base>0) || [r.reaction,r.action,r.conversion,r.spend,r.frequency].some(Number.isNaN)){ errors.push(`${i+2}번째 줄: 숫자가 아닌 값이나 0 이하 분모가 있어요`); return; }
    rows.push(r);
  });
  return {rows,errors};
}
function rates(r){
  const cfg=CH[r.channel];
  const rr = cfg.reaction && r.reaction!=null ? r.reaction/r.base : null;
  const den = cfg.actionDenom==='reaction' ? r.reaction : r.base;
  const ar = r.action!=null && den ? r.action/den : null;
  const cr = r.conversion!=null && r.action ? r.conversion/r.action : null;
  const cpa = r.spend && r.conversion ? r.spend/r.conversion : null;
  return {rr,ar,cr,cpa};
}
const RANK={'아직 모름':0,'목표 없음':0,'유지':1,'지켜보기':2,'수정':3,'중단 후보':4};
function analyze(rows){
  const groups={};
  rows.forEach(r=>{ (groups[r.content+'|'+r.channel] ||= []).push(r); });
  const results=[];
  for(const key in groups){
    const g=groups[key].sort((a,b)=>a.period.localeCompare(b.period));
    const cur=g[g.length-1], prev=g.length>1?g[g.length-2]:null;
    const cfg=CH[cur.channel], goal=S.goals[cur.channel]||{};
    const R1=rates(cur), R0=prev?rates(prev):null;
    const res={content:cur.content,title:cur.title,channel:cur.channel,aud:cfg.aud,cur,prev,R1,R0,verdict:'유지',rules:[],notes:[],fix:null};
    const up=(v,rule,note)=>{ if(RANK[v]>RANK[res.verdict]) res.verdict=v; if(rule&&!res.rules.includes(rule)) res.rules.push(rule); if(note) res.notes.push(note); };
    const hasGoal = goal.a!=null || goal.r!=null;
    if(!hasGoal){ res.verdict='목표 없음'; res.rules.push('r-6'); res.notes.push('목표가 없어 판정하지 않아요'); results.push(res); continue; }
    if(cur.base<cfg.min){ res.verdict='아직 모름'; res.rules.push('r-1'); res.notes.push(`${cfg.base} ${cur.base.toLocaleString()} — 기준 ${cfg.min.toLocaleString()} 미만`); results.push(res); continue; }
    const miss=R=>({r: goal.r!=null && R.rr!=null && R.rr*100<goal.r, a: goal.a!=null && R.ar!=null && R.ar*100<goal.a});
    const m1=miss(R1), m0=(prev && prev.base>=cfg.min)?miss(R0):null;
    const hasR=!!cfg.reaction;
    const bad=m=> hasR ? (m.r&&m.a) : m.a;
    if(bad(m1) && m0 && bad(m0)){
      up('중단 후보','r-5','2회 연속 반응 · 행동 모두 목표 미달'); res.fix='stop';
    } else if(m1.r||m1.a){
      const rule = m1.r ? 'r-4' : 'r-3';
      const why = m1.r ? `${cfg.reaction} ${pct(R1.rr)} < 목표 ${goal.r}%` : `${cfg.action}률 ${pct(R1.ar)} < 목표 ${goal.a}%`;
      if(m0 && (m0.r||m0.a)){ up('수정',rule,why+' (2회째)'); res.fix=rule; }
      else { up('지켜보기','r-1',why+' — 1회째라 지켜봐요'); res.rules.push(rule); }
    }
    if(cfg.ads){
      if(prev && R0 && cur.frequency>=3 && R0.rr && R1.rr<R0.rr*0.8){
        up('수정','r-7',`빈도 ${cur.frequency} · CTR ${pct(R0.rr)} → ${pct(R1.rr)}`); res.fix=res.fix||'r-7';
        if(res.fix!=='stop') res.fix='r-7';
      }
      if(goal.c!=null && cur.conversion!=null){
        if(cur.action>=100){ if(R1.cr*100<goal.c){ up('수정','r-3',`구매율 ${pct(R1.cr)} < 목표 ${goal.c}% — 랜딩부터`); if(!res.fix) res.fix='r-3'; } }
        else res.notes.push(`구매율은 랜딩 도착 ${cur.action}건이라 판단 보류 (r-1)`);
      }
      if(goal.cpa && R1.cpa && cur.action>=100 && R1.cpa>goal.cpa) res.notes.push(`CPA ${won(R1.cpa)} > 목표 ${won(goal.cpa)}`);
      if(prev && prev.spend && cur.spend>prev.spend*1.3){ res.notes.push(`지출 ${Math.round((cur.spend/prev.spend-1)*100)}% 증가 — 예산 변경인지는 변경 기록 확인 전엔 모름`); if(!res.rules.includes('r-8')) res.rules.push('r-8'); }
    }
    results.push(res);
  }
  results.sort((a,b)=>a.content.localeCompare(b.content)||Object.keys(CH).indexOf(a.channel)-Object.keys(CH).indexOf(b.channel));
  return results;
}
function buildProposals(results){
  const P=[];
  const owner=r=> r.fix==='stop' ? '관리자(유이)' : (r.aud==='HCP' ? '제작자 · 약사용' : '제작자 · 대중용');
  const todo={ 'r-3':'첫 장 · 버튼 문구 · 도착 페이지를 고친 v2 만들기', 'r-4':'제목 · 미리보기 문구 2안 + 보내는 시간 바꿔 보기',
               'r-7':'새 소재 2안 (첫 장면 바꾸기) — 대중 광고 심의 규칙으로 리뷰 먼저', 'stop':'이 채널에서 이 콘텐츠를 멈출지 결정' };
  results.filter(r=>r.verdict==='수정'||r.verdict==='중단 후보').forEach(r=>{
    P.push({id:`${r.content}-${r.channel}`, content:r.content, title:r.title, scope:CH[r.channel].label, aud:r.aud,
      owner:owner(r), text:todo[r.fix]||'원인 확인', rules:r.rules.join(' · '), evidence:r.notes.join(' / ')});
  });
  const by={}; results.forEach(r=>{ if(r.fix==='stop'||r.fix==='r-4') (by[r.content] ||= []).push(r); });
  for(const c in by){ if(by[c].length>=2){
    P.push({id:`${c}-message`, content:c, title:by[c][0].title, scope:'콘텐츠 전체', aud:'공통', owner:'기획자',
      text:'채널마다 따로 고치기 전에 메시지 자체를 다시 보기 — 약사가 실제로 묻는 질문과 맞는지', rules:'r-9',
      evidence: by[c].map(r=>CH[r.channel].label).join(' · ')+'에서 같이 부진'});
  }}
  return P;
}
function run(){
  const {rows,errors}=parseCSV(S.csv);
  S.errors=errors; S.results=analyze(rows); S.proposals=buildProposals(S.results);
  const pending=S.proposals.filter(p=>!S.decisions[p.id]).length;
  addLog('분석가',`계산기로 ${rows.length}줄 집계 → 판정 ${S.results.length}건 · 제안 ${S.proposals.length}건 (승인 대기 ${pending})`);
  setAgent('analyst','승인대기',`판정 ${S.results.length}건 · 제안 ${S.proposals.length}건 → 관리자 승인함`);
  render();
}

  document.getElementById('perf').hidden = S.tab!=='perf';
  document.querySelectorAll('#tabs button[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  document.querySelectorAll('#audSeg button').forEach(b=>b.classList.toggle('on',b.dataset.aud===S.aud));
  renderOffice(); renderPerf();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.tab){ S.tab=t.dataset.tab; render(); }
  else if(t.dataset.aud){ S.aud=t.dataset.aud; render(); }
  else if(t.dataset.go){ S.tab=t.dataset.go; render(); }
  else if(t.id==='play') play();
  else if(t.id==='step') stepOffice();
  else if(t.id==='reset') resetOffice();
  else if(t.id==='run'){ const ta=document.getElementById('csv'); if(ta) S.csv=ta.value; run(); }
  else if(t.id==='sample'){ S.csv=SAMPLE; run(); }
  else if(t.id==='goalReset'){ S.goals=JSON.parse(JSON.stringify(DEFAULT_GOALS)); store.set('goals',S.goals); run(); }
  else if(t.dataset.decide){
    const id=t.dataset.decide, reason=(document.getElementById('why-'+id)||{}).value||'';
    S.decisions[id]={choice:t.dataset.choice,reason}; store.set('decisions',S.decisions);
    addLog('유이 (관리자)',`${id} → ${t.dataset.choice}${reason?' · '+reason:''}`);
    if(t.dataset.choice!=='승인'||reason) addLog('러닝 담당',`${id} 결정 이유를 규칙 후보로 기록`);
    render();
  }
  else if(t.dataset.undo){ delete S.decisions[t.dataset.undo]; store.set('decisions',S.decisions); render(); }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='file' && t.files[0]){ const fr=new FileReader(); fr.onload=()=>{ S.csv=String(fr.result); run(); }; fr.readAsText(t.files[0]); }
  if(t.dataset.goal){ const g=(S.goals[t.dataset.goal] ||= {}); const v=t.value.trim(); if(v==='') delete g[t.dataset.k]; else g[t.dataset.k]=Number(v); store.set('goals',S.goals); run(); }
});
S.log=[]; run(); S.log=[]; setAgent('analyst','대기','—'); render();
</script>
</body>
</html>
